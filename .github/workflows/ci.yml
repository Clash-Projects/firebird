name: CI & Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check-windows:
    name: Check & Test Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-check-windows-x64
          cache-on-failure: true
      - name: Cargo check (workspace)
        run: cargo check --workspace
      - name: Cargo test (workspace lib)
        run: cargo test --workspace --lib

  check-linux:
    name: Check & Test Linux (x64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-check-linux-x64
          cache-on-failure: true
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev
      - name: Cargo check (workspace)
        run: cargo check --workspace
      - name: Cargo test (workspace lib)
        run: cargo test --workspace --lib

  check-macos:
    name: Check & Test macOS (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-check-macos-arm64
          cache-on-failure: true
      - name: Cargo check (workspace)
        run: cargo check --workspace
      - name: Cargo test (workspace lib)
        run: cargo test --workspace --lib

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: Windows-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            Windows-bun-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tauri-build-windows-x64
          cache-on-failure: true

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri app (portable)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: bun run tauri build --no-bundle

      - name: Build Tauri app (release installers)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bun run tauri
          tagName: ${{ github.ref_name }}
          releaseName: LastWave ${{ github.ref_name }}
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: true
          prerelease: false

      - name: Prepare Windows portable bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable/lastwave | Out-Null
          Copy-Item target/release/lastwave.exe portable/lastwave/
          Copy-Item -Recurse src-tauri/assets portable/lastwave/assets

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-Desktop-Windows
          if-no-files-found: error
          retention-days: 14
          path: portable/lastwave/

      - name: Upload Windows Installers (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-Windows-Installer
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe

  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: Linux-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            Linux-bun-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tauri-build-linux-x64
          cache-on-failure: true

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libdbus-1-dev

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri app (portable)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: bun run tauri build --no-bundle

      - name: Build Tauri app (release installers)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bun run tauri
          tagName: ${{ github.ref_name }}
          releaseName: LastWave ${{ github.ref_name }}
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: true
          prerelease: false

      - name: Prepare Linux portable bundle
        run: |
          mkdir -p portable/lastwave
          cp target/release/lastwave portable/lastwave/
          cp -r src-tauri/assets portable/lastwave/assets

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-Desktop-Linux-x64
          if-no-files-found: error
          retention-days: 14
          path: portable/lastwave/

      - name: Upload Linux Packages (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-Linux-Packages-x64
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/rpm/*.rpm

      - name: Upload Linux AppImage (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-Linux-AppImage
          if-no-files-found: warn
          retention-days: 14
          path: target/**/release/bundle/appimage/*.AppImage

  build-macos:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: macOS-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            macOS-bun-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tauri-build-macos-arm64
          cache-on-failure: true

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri app (portable .app)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: bun run tauri build --target aarch64-apple-darwin --bundles app

      - name: Build Tauri app (release installers)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bun run tauri
          args: --target aarch64-apple-darwin
          tagName: ${{ github.ref_name }}
          releaseName: LastWave ${{ github.ref_name }}
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: true
          prerelease: false

      - name: Compress macOS Bundle
        run: |
          mkdir -p portable
          ditto -c -k --keepParent \
            "target/aarch64-apple-darwin/release/bundle/macos/LastWave.app" \
            "portable/lastwave-macos-arm64.zip"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-Desktop-macOS
          if-no-files-found: error
          retention-days: 14
          path: portable/lastwave-macos-arm64.zip
