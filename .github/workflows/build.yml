name: Build Tauri App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            platform: macos-latest
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            artifact_suffix: macos-arm64
          - name: macOS (Intel)
            platform: macos-latest
            rust_target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            artifact_suffix: macos-x64
          - name: Linux (x64)
            platform: ubuntu-22.04
            rust_target: ''
            args: ''
            artifact_suffix: linux-x64
          - name: Windows (x64)
            platform: windows-latest
            rust_target: ''
            args: ''
            artifact_suffix: windows-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tauri-build-${{ matrix.artifact_suffix }}
          cache-on-failure: true

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libdbus-1-dev

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bun run tauri
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('LastWave {0}', github.ref_name) || '' }}
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: true
          prerelease: false

      - name: Package portable build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable/lastwave | Out-Null
          Copy-Item target/release/lastwave.exe portable/lastwave/
          Copy-Item -Recurse src-tauri/assets portable/lastwave/assets
          Compress-Archive -Path portable/lastwave/* -DestinationPath portable/lastwave-windows-x64-portable.zip -Force

      - name: Package portable build (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p portable/lastwave
          cp target/release/lastwave portable/lastwave/
          cp -r src-tauri/assets portable/lastwave/assets
          tar -czf portable/lastwave-linux-x64-portable.tar.gz -C portable lastwave
          cp target/release/bundle/appimage/*.AppImage portable/ 2>/dev/null || true

      - name: Package portable build (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p portable
          tar -czf "portable/lastwave-${{ matrix.artifact_suffix }}-portable.tar.gz" \
            -C "target/${{ matrix.rust_target }}/release/bundle/macos" LastWave.app

      - name: Upload portable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lastwave-portable-${{ matrix.artifact_suffix }}
          if-no-files-found: error
          retention-days: 14
          path: |
            portable/*.zip
            portable/*.tar.gz
            portable/*.AppImage

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lastwave-installers-${{ matrix.artifact_suffix }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/rpm/*.rpm
            target/**/release/bundle/appimage/*.AppImage
